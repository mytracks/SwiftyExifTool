# XcodeGen spec for the SwiftyExif debug app.
# Generate the project with:  xcodegen generate --spec App/project.yml
# The generated SwiftyExif.xcodeproj, Info.plist and entitlements are not committed.
name: SwiftyExif
options:
  bundleIdPrefix: info.stichling
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  SwiftyExifTool:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 4TNB35NY7G
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SwiftyExif:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SwiftyExif
        excludes:
          - Generated
    dependencies:
      - package: SwiftyExifTool
        product: SwiftyExifTool
    settings:
      base:
        PRODUCT_NAME: SwiftyExif
        PRODUCT_BUNDLE_IDENTIFIER: info.stichling.SwiftyExif
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SwiftyExif/Generated/SwiftyExif-macOS.entitlements
    info:
      path: SwiftyExif/Generated/Info.plist
      properties:
        CFBundleDisplayName: SwiftyExif
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image Metadata
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.tiff, public.camera-raw-image, com.adobe.raw-image]
    entitlements:
      path: SwiftyExif/Generated/SwiftyExif-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  SwiftyExifTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SwiftyExifTests
      - path: ../Tests/SwiftyExifToolTests/Fixtures/synthetic
        type: folder
        buildPhase: resources
    dependencies:
      - target: SwiftyExif
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.stichling.SwiftyExifTests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/SwiftyExif.app/Contents/MacOS/SwiftyExif"
        "TEST_HOST[sdk=iphone*]": "$(BUILT_PRODUCTS_DIR)/SwiftyExif.app/SwiftyExif"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SwiftyExif:
    build:
      targets:
        SwiftyExif: all
        SwiftyExifTests: [test]
    test:
      targets:
        - SwiftyExifTests
